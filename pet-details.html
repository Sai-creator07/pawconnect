<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Details | PawConnect</title>
  <meta name="description" content="Read about a pet available for adoption on PawConnect.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="adopt" data-view="details">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <noscript><div class="container"><p class="notice">PawConnect needs JavaScript to show pet details. Please turn JavaScript on.</p></div></noscript>

  <main id="main">
    <section class="section">
      <div class="container">
        <div id="pet-detail" class="detail"></div>
      </div>
    </section>

    <section id="enquiry" class="section section--sage" aria-labelledby="enquiry-title" tabindex="-1">
      <div class="container">
        <div class="section-head">
          <h2 id="enquiry-title">Ask about adoption</h2>
          <p>Fill in this form to ask about the pet.</p>
        </div>
        <div class="notice"><strong>Demonstration only.</strong> This website has no server, so enquiries are not delivered to anyone. For listings you add yourself with an email address, a link to your email app is offered after you submit.</div>

        <div id="lister-info" class="contact-box" hidden></div>

        <form id="enquiry-form" class="form-card" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="enqName">Your name <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="enqName" name="enqName" autocomplete="name" aria-required="true" aria-describedby="enqName-error">
              <p class="error" id="enqName-error" aria-live="polite" hidden></p>
            </div>
            <div class="field">
              <label for="enqContact">Your email or phone <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="enqContact" name="enqContact" autocomplete="email" aria-required="true" aria-describedby="enqContact-error">
              <p class="error" id="enqContact-error" aria-live="polite" hidden></p>
            </div>
            <div class="field full">
              <label for="enqPet">Selected pet</label>
              <input type="text" id="enqPet" name="enqPet" readonly>
            </div>
            <div class="field full">
              <label for="enqMessage">Message <span class="req" aria-hidden="true">*</span></label>
              <textarea id="enqMessage" name="enqMessage" aria-required="true" aria-describedby="enqMessage-error" placeholder="Tell the lister a little about your home and why you would like to adopt."></textarea>
              <p class="error" id="enqMessage-error" aria-live="polite" hidden></p>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Send enquiry</button>
          </div>
          <div id="enquiry-status" role="status" hidden></div>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
